name: therefore_pointage
description: Application de pointage Therefore
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  local_auth: ^2.3.0
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  supabase_flutter: ^2.5.6

  # Réseau
  dio: ^5.4.0
  connectivity_plus: ^6.0.0

  # Sécurité / stockage
  flutter_secure_storage: ^9.0.0

  # State management
  flutter_riverpod: ^2.5.1

  # UI
  google_fonts: ^6.2.1
  intl: ^0.19.0

  # Utilitaires
  equatable: ^2.0.5
  logger: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
  fonts:
  - family: Jost
    fonts:
    - asset: assets/fonts/Jost-SemiBold.ttf
flutter_icons:
  android: true
  ios: true
  image_path: "assets/icons/ic_launcher.png"