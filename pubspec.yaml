name: therefore_pointage
description: Application de pointage Therefore
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # Réseau
  http: ^1.2.2

  # Sécurité / stockage
  flutter_secure_storage: ^9.0.0
  local_auth: ^2.3.0

  # Formatage des dates
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
  fonts:
    - family: Jost
      fonts:
        - asset: assets/fonts/Jost-SemiBold.ttf

flutter_icons:
  android: true
  ios: true
  image_path: "assets/icons/ic_launcher.png"